
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project H</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#171717;font-family:Arial,sans-serif}
header{background:#171717;color:white;padding:18px;text-align:center}
main{max-width:650px;margin:20px auto;padding:12px}
section,.post{background:white;padding:16px;border-radius:12px;margin-bottom:14px}
input,textarea,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ddd;font-size:15px}
textarea{min-height:85px;resize:vertical}
button{background:#171717;color:white;border:0;font-weight:bold;cursor:pointer}
button.secondary{background:#e5e7eb;color:#171717}
small,.muted{color:#666}
.post img,.post video{width:100%;max-height:400px;object-fit:contain;margin-top:10px;border-radius:8px}
.post p{white-space:pre-wrap;overflow-wrap:anywhere}
#status{margin:10px 0;color:#444}
</style>
</head>
<body>
<header>
<h1>Project H</h1>
<p>Share something. Discover something.</p>
</header>

<main>
<section>
<h3>Account</h3>
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password (at least 6 characters)">
<button id="signup">Create account</button>
<button id="login" class="secondary">Log in</button>
<button id="logout" class="secondary" hidden>Log out</button>

<p id="accountStatus" class="muted">You are not logged in.</p>
</section>
  <input id="username" placeholder="Choose a username">
<input id="displayName" placeholder="Your display name">
<textarea id="bio" placeholder="Write a short bio"></textarea>
<button id="saveProfile">Save profile</button>
<p id="profileStatus" class="muted"></p>

<section>
<h3>Create a post</h3>
<textarea id="content" placeholder="What's happening?"></textarea>
<input id="media" type="file" accept="image/*,video/*" multiple>
<small>You can attach up to 5 photos or videos. Max 50 MB each.</small>
<button id="publish">Publish</button>
<p id="status"></p>
</section>

<h2>Community Feed</h2>
  <h2>🔍 Discover Members</h2>
<input id="userSearch" placeholder="Search by username...">
<button id="searchUsers">Search</button>
<div id="searchResults"></div>
<div id="feed">Loading posts...</div>
</main>

<script>
    
const SUPABASE_URL = "https://dlfxcsugbmrxxnxcxyqx.supabase.co";
const SUPABASE_KEY = "sb_publishable_pnF24wLGOT932BpguFYx3g_l1-e0XA0";

const $ = id => document.getElementById(id);

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

function message(text) {
  $("status").textContent = text;
}

function withTimeout(promise, label) {
  let timer;

  return Promise.race([
    promise,
    new Promise((_, reject) => {
      timer = setTimeout(
        () => reject(new Error(label + " timed out. Please refresh.")),
        15000
      );
    })
  ]).finally(() => clearTimeout(timer));
}

async function getProfile(userId) {
  const { data, error } = await withTimeout(
    db.from("profiles")
      .select("username, display_name")
      .eq("user_id", userId)
      .maybeSingle(),
    "Profile request"
  );

  if (error) throw error;
  return data;
}

async function updateAccount() {
  const { data, error } = await withTimeout(
    db.auth.getSession(),
    "Account request"
  );

  if (error) throw error;

  const user = data.session?.user;

  $("accountStatus").textContent = user
    ? "Logged in as " + user.email
    : "You are not logged in.";

  $("logout").hidden = !user;
}

$("signup").onclick = async () => {
  try {
    const email = $("email").value.trim();
    const password = $("password").value;

    if (!email || password.length < 6) {
      alert("Enter an email and a password with at least 6 characters.");
      return;
    }

    const { error } = await withTimeout(
      db.auth.signUp({ email, password }),
      "Signup"
    );

    if (error) throw error;

    alert("Account request submitted. Check your email if confirmation is required.");
    await updateAccount();

  } catch (error) {
    alert("Signup error: " + error.message);
  }
};

$("login").onclick = async () => {
  try {
    const email = $("email").value.trim();
    const password = $("password").value;

    if (!email || !password) {
      alert("Enter your email and password.");
      return;
    }

    const { error } = await withTimeout(
      db.auth.signInWithPassword({ email, password }),
      "Login"
    );

    if (error) throw error;

    alert("Logged in successfully!");
    await updateAccount();
    await loadPosts();

  } catch (error) {
    alert("Login error: " + error.message);
  }
};

$("logout").onclick = async () => {
  try {
    const { error } = await withTimeout(
      db.auth.signOut(),
      "Logout"
    );

    if (error) throw error;

    await updateAccount();
    message("Logged out.");
    await loadPosts();

  } catch (error) {
    message("Logout error: " + error.message);
  }
};

$("saveProfile").onclick = async () => {
  try {
    const { data, error: sessionError } =
      await db.auth.getSession();

    if (sessionError) throw sessionError;

    const user = data.session?.user;

    if (!user) {
      alert("Please log in first.");
      return;
    }

    const username = $("username").value.trim();
    const displayName = $("displayName").value.trim();
    const bio = $("bio").value.trim();

    if (!username || !displayName) {
      alert("Username and display name are required.");
      return;
    }

    const { error } = await withTimeout(
      db.from("profiles").upsert({
        user_id: user.id,
        username,
        display_name: displayName,
        bio
      }, { onConflict: "user_id" }),
      "Profile save"
    );

    if (error) throw error;

    $("profileStatus").textContent = "Profile saved successfully!";
    await loadPosts();

  } catch (error) {
    $("profileStatus").textContent =
      "Error: " + error.message;
  }
};

async function loadPosts() {
  const feed = $("feed");
  feed.textContent = "Loading posts...";

  try {
    const { data: posts, error } = await withTimeout(
      db.from("posts")
        .select("*")
        .order("created_at", { ascending: false }),
      "Posts request"
    );

    if (error) throw error;

    feed.replaceChildren();

    if (!posts || posts.length === 0) {
      feed.textContent = "No posts yet. Be the first to share!";
      return;
    }

    for (const post of posts) {
      const card = document.createElement("article");
      card.className = "post";

      // Post author
      try {
        const profile = await getProfile(post.user_id);

        const author = document.createElement("p");
        author.textContent = profile
          ? profile.display_name + " (@" + profile.username + ")"
          : "Project H member";

        card.appendChild(author);
      } catch (error) {
        const author = document.createElement("p");
        author.textContent = "Project H member";
        card.appendChild(author);
      }

      // Post content
      const content = document.createElement("p");
      content.textContent = String(post.content ?? "");
      card.appendChild(content);

      // Post date
      const date = document.createElement("small");
      date.textContent =
        new Date(post.created_at).toLocaleString();
      card.appendChild(date);

      // Media
      const { data: mediaItems, error: mediaError } =
        await withTimeout(
          db.from("post_media")
            .select("*")
            .eq("post_id", post.id),
          "Media request"
        );

      if (mediaError) throw mediaError;

      for (const item of mediaItems || []) {
        const { data: urlData, error: urlError } =
          await withTimeout(
            db.storage
              .from("post-media")
              .createSignedUrl(item.storage_path, 3600),
            "Image request"
          );

        if (urlError || !urlData?.signedUrl) continue;

        const element = document.createElement(
          item.media_type === "video" ? "video" : "img"
        );

        element.src = urlData.signedUrl;

        if (item.media_type === "video") {
          element.controls = true;
        } else {
          element.alt = "Post image";
        }

        card.appendChild(element);
      }

      // Like count
      const { count, error: likeError } = await withTimeout(
        db.from("post_likes")
          .select("*", { count: "exact", head: true })
          .eq("post_id", post.id),
        "Like count request"
      );

      if (likeError) throw likeError;

      const likeCount = document.createElement("p");
      likeCount.textContent =
        "❤️ " + (count ?? 0) + " likes";
      card.appendChild(likeCount);

      // Like button
      const likeButton = document.createElement("button");
      likeButton.textContent = "❤️ Like";

      likeButton.onclick = async () => {
        try {
          const { data } = await db.auth.getSession();
          const user = data.session?.user;

          if (!user) {
            alert("Please log in to like posts.");
            return;
          }

          const { error } = await db.from("post_likes").insert({
            post_id: post.id,
            user_id: user.id
          });

          if (error) throw error;

          likeButton.textContent = "❤️ Liked";
          likeButton.disabled = true;

        } catch (error) {
          alert("Like error: " + error.message);
        }
      };

      card.appendChild(likeButton);

      // Comments
      const commentSection = document.createElement("div");

      const commentTitle = document.createElement("h4");
      commentTitle.textContent = "💬 Comments";
      commentSection.appendChild(commentTitle);

      const { data: comments, error: commentError } =
        await withTimeout(
          db.from("post_comments")
            .select("*")
            .eq("post_id", post.id)
            .order("created_at", { ascending: true }),
          "Comments request"
        );

      if (commentError) throw commentError;

      for (const comment of comments || []) {
        const item = document.createElement("p");

        let commenter = null;

        try {
          commenter = await getProfile(comment.user_id);
        } catch (error) {}

        const commentAuthor = document.createElement("strong");

        commentAuthor.textContent = commenter
          ? commenter.display_name + " (@" + commenter.username + "): "
          : "Project H member: ";

        item.appendChild(commentAuthor);
        item.appendChild(
          document.createTextNode(comment.content)
        );

        commentSection.appendChild(item);
      }

      // New comment input
      const commentInput = document.createElement("input");
      commentInput.placeholder = "Write a comment...";
      commentSection.appendChild(commentInput);

      const commentButton = document.createElement("button");
      commentButton.textContent = "Post comment";

      commentButton.onclick = async () => {
        try {
          const { data } = await db.auth.getSession();
          const user = data.session?.user;

          if (!user) {
            alert("Please log in to comment.");
            return;
          }

          const commentContent = commentInput.value.trim();

          if (!commentContent) {
            alert("Write a comment first.");
            return;
          }

          const { error } = await db.from("post_comments").insert({
            post_id: post.id,
            user_id: user.id,
            content: commentContent
          });

          if (error) throw error;

          await loadPosts();

        } catch (error) {
          alert("Comment error: " + error.message);
        }
      };

      commentSection.appendChild(commentButton);
      card.appendChild(commentSection);
      feed.appendChild(card);
    }

  } catch (error) {
    feed.textContent = "Feed error: " + error.message;
  }
};

// Publish post
$("publish").onclick = async () => {
  try {
    message("Publishing...");

    const { data } = await db.auth.getSession();
    const user = data.session?.user;

    if (!user) {
      message("Please log in first.");
      return;
    }

    const content = $("content").value.trim();
    const files = Array.from($("media").files);

    if (!content && files.length === 0) {
      message("Write something or select a photo/video.");
      return;
    }

    if (files.length > 5) {
      message("Please select no more than 5 files.");
      return;
    }

    for (const file of files) {
      if (file.size > 50 * 1024 * 1024) {
        message("Each file must be smaller than 50 MB.");
        return;
      }

      if (!file.type.startsWith("image/") &&
          !file.type.startsWith("video/")) {
        message("Only images and videos are supported.");
        return;
      }
    }

    const { data: post, error: postError } =
      await db.from("posts")
        .insert({
          user_id: user.id,
          content
        })
        .select()
        .single();

    if (postError) throw postError;

    for (const file of files) {
      const safeName = file.name.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );

      const path =
        user.id + "/" + crypto.randomUUID() + "_" + safeName;

      const { error: uploadError } = await db.storage
        .from("post-media")
        .upload(path, file);

      if (uploadError) throw uploadError;

      const { error: mediaError } = await db
        .from("post_media")
        .insert({
          post_id: post.id,
          user_id: user.id,
          storage_path: path,
          media_type: file.type.startsWith("video/")
            ? "video"
            : "image"
        });

      if (mediaError) throw mediaError;
    }

    $("content").value = "";
    $("media").value = "";

    message("Your post was published!");
    await loadPosts();

  } catch (error) {
    message("Publish error: " + error.message);
  }
};

// Auth state updates
db.auth.onAuthStateChange((_event, session) => {
  const user = session?.user;

  $("accountStatus").textContent = user
    ? "Logged in as " + user.email
    : "You are not logged in.";

  $("logout").hidden = !user;
});

// Initial loading
(async () => {
  try {
    await updateAccount();
  } catch (error) {
    $("accountStatus").textContent =
      "Account error: " + error.message;
  }

  await loadPosts();
})();
 // Discover members by username
$("searchUsers").onclick = async () => {
  const results = $("searchResults");
  const query = $("userSearch").value.trim();

  if (!query) {
    results.textContent = "Enter a username to search.";
    return;
  }

  results.textContent = "Searching...";

  try {
    const { data, error } = await db
      .from("profiles")
      .select("username, display_name, bio")
      .ilike("username", "%" + query + "%")
      .limit(20);

    if (error) throw error;

    results.replaceChildren();

    if (!data || data.length === 0) {
      results.textContent = "No members found.";
      return;
    }

    data.forEach(profile => {
      const card = document.createElement("div");
      card.className = "post";

      const name = document.createElement("strong");
      name.textContent = profile.display_name || "Member";

      const username = document.createElement("p");
      username.textContent = "@" + profile.username;

      const bio = document.createElement("p");
      bio.textContent = profile.bio || "";

      card.append(name, username, bio);
      results.appendChild(card);
    });

  } catch (error) {
    results.textContent = "Search error: " + error.message;
  }
};   

        

  
</script>
</body>
</html>
