
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project H</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0b0d18;
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 22px;
      background: #15182a;
      border-bottom: 1px solid #30334c;
    }
    header h1 { margin: 0; color: #a98cff; }
    main { padding: 20px; max-width: 600px; margin: auto; }
    .card {
      background: #171b30;
      padding: 18px;
      border-radius: 16px;
      margin: 15px 0;
    }
    textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      background: #0b0d18;
      color: white;
      border: 1px solid #444;
    }
    button {
      background: #8866e8;
      color: white;
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      margin-top: 10px;
      font-weight: bold;
    }
    .post { border-bottom: 1px solid #333; padding: 12px 0; }
  </style>
</head>
<body>
  <header>
    <h1>PROJECT H</h1>
    <p>Discover. Connect. Create.</p>
  </header>

  <main>
    <div class="card">
      <h2>Welcome to Project H!</h2>
      <p>Your new social world starts here.</p>
    </div>

    <div class="card">
      <h3>Create a post</h3>
      <textarea id="message" placeholder="What's on your mind?"></textarea>
      <button onclick="publishPost()">Publish</button>
    </div>

    <h2>Community feed</h2>
    <div id="feed">
      <div class="card post">
        Welcome! This is the beginning of Project H.
      </div>
    </div>
  </main>

  <script>
    function publishPost() {
      const input = document.getElementById("message");
      const text = input.value.trim();

      if (!text) {
        alert("Write something first!");
        return;
      }

      const post = document.createElement("div");
      post.className = "card post";
      post.textContent = text;

      document.getElementById("feed").prepend(post);
      input.value = "";
    }
  </script>
</body>
</html>
