
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project H</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#171717;font-family:Arial,sans-serif}
header{background:#171717;color:white;padding:18px;text-align:center}
main{max-width:650px;margin:20px auto;padding:12px}
section,.post{background:white;padding:16px;border-radius:12px;margin-bottom:14px}
input,textarea,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ddd;font-size:15px}
textarea{min-height:85px;resize:vertical}
button{background:#171717;color:white;border:0;font-weight:bold;cursor:pointer}
button.secondary{background:#e5e7eb;color:#171717}
small,.muted{color:#666}
.post img,.post video{width:100%;max-height:400px;object-fit:contain;margin-top:10px;border-radius:8px}
.post p{white-space:pre-wrap;overflow-wrap:anywhere}
#status{margin:10px 0;color:#444}
</style>
</head>
<body>
<header>
<h1>Project H</h1>
<p>Share something. Discover something.</p>
</header>

<main>
<section>
<h3>Account</h3>
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password (at least 6 characters)">
<button id="signup">Create account</button>
<button id="login" class="secondary">Log in</button>
<button id="logout" class="secondary" hidden>Log out</button>
<p id="accountStatus" class="muted">You are not logged in.</p>
</section>

<section>
<h3>Create a post</h3>
<textarea id="content" placeholder="What's happening?"></textarea>
<input id="media" type="file" accept="image/*,video/*" multiple>
<small>You can attach up to 5 photos or videos. Max 50 MB each.</small>
<button id="publish">Publish</button>
<p id="status"></p>
</section>

<h2>Community Feed</h2>
<div id="feed">Loading posts...</div>
</main>

<script>
const SUPABASE_URL = "https://dlfxcsugbmrxxnxcxyqx.supabase.co    ";
const SUPABASE_KEY = "sb_publishable_pnF24wLGOT932BpguFYx3g_l1-e0XA0";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);

function message(text) {
  $("status").textContent = text;
}

function escapeText(value) {
  return String(value ?? "");
}

async function updateAccount() {
  const { data } = await db.auth.getSession();
  const user = data.session?.user;

  $("accountStatus").textContent = user
    ? "Logged in as " + user.email
    : "You are not logged in.";

  $("logout").hidden = !user;
  return user;
}

$("signup").onclick = async () => {
  const email = $("email").value.trim();
  const password = $("password").value;

  if (!email || password.length < 6) {
    alert("Enter an email and a password with at least 6 characters.");
    return;
  }

  const { error } = await db.auth.signUp({ email, password });

  if (error) alert(error.message);
  else alert("Account request submitted. Check your email if confirmation is required.");
  await updateAccount();
};

$("login").onclick = async () => {
  const { error } = await db.auth.signInWithPassword({
    email: $("email").value.trim(),
    password: $("password").value
  });

  if (error) alert(error.message);
  else {
    alert("Logged in successfully!");
    await updateAccount();
    await loadPosts();
  }
};

$("logout").onclick = async () => {
  await db.auth.signOut();
  await updateAccount();
  message("Logged out.");
};

async function loadPosts() {
  const feed = $("feed");
  feed.textContent = "Loading posts...";

  const { data: posts, error } = await db
    .from("posts")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    feed.textContent = "Could not load posts: " + error.message;
    return;
  }

  feed.replaceChildren();

  if (!posts || posts.length === 0) {
    feed.textContent = "No posts yet. Be the first to share!";
    return;
  }

  for (const post of posts) {
    const card = document.createElement("article");
    card.className = "post";

    const text = document.createElement("p");
    text.textContent = escapeText(post.content);
    card.appendChild(text);

    const date = document.createElement("small");
    date.textContent = new Date(post.created_at).toLocaleString();
    card.appendChild(date);

    const { data: mediaItems, error: mediaError } = await db
      .from("post_media")
      .select("*")
      .eq("post_id", post.id);

    if (mediaError) {
      const note = document.createElement("p");
      note.textContent = "Media could not be loaded.";
      card.appendChild(note);
    } else {
      for (const item of mediaItems || []) {
        const { data: urlData, error: urlError } = await db.storage
  .from("post-media")
  .createSignedUrl(item.storage_path, 60 * 60);

if (urlError || !urlData?.signedUrl) {
  continue;
}

        const element = document.createElement(
          item.media_type === "video" ? "video" : "img"
        );

        element.src = urlData.signedUrl;
        element.onerror = () => {
  element.alt = "IMAGE ERROR: Could not load this file";
  element.style.border = "2px solid red";
};

        if (item.media_type === "video") {
          element.controls = true;
        } else {
          element.alt = "Post image";
        }

        card.appendChild(element);
      }
    }
const likeButton = document.createElement("button");
likeButton.textContent = "❤️ Like";
likeButton.onclick = async () => {
  const { data: sessionData } = await db.auth.getSession();
  const user = sessionData.session?.user;

  if (!user) {
    alert("Please log in to like posts.");
    return;
  }

  const { error } = await db
    .from("post_likes")
    .insert({
      post_id: post.id,
      user_id: user.id
    });

  if (error) {
    alert(error.code === "23505"
      ? "You already liked this post!"
      : error.message);
    return;
  }

  likeButton.textContent = "❤️ Liked";
  likeButton.disabled = true;
};

card.appendChild(likeButton);
    feed.appendChild(card);
  }
}

$("publish").onclick = async () => {
  message("Publishing...");

  const { data: sessionData } = await db.auth.getSession();
  const user = sessionData.session?.user;

  if (!user) {
    message("Please create an account or log in first.");
    return;
  }

  const content = $("content").value.trim();
  const files = Array.from($("media").files);

  if (!content && files.length === 0) {
    message("Write something or select a photo/video.");
    return;
  }

  if (files.length > 5) {
    message("Please select no more than 5 files.");
    return;
  }

  for (const file of files) {
    if (file.size > 50 * 1024 * 1024) {
      message("Each file must be smaller than 50 MB.");
      return;
    }

    if (!file.type.startsWith("image/") &&
        !file.type.startsWith("video/")) {
      message("Only image and video files are supported.");
      return;
    }
  }

  const { data: post, error: postError } = await db
    .from("posts")
    .insert({
      user_id: user.id,
      content: content
    })
    .select()
    .single();

  if (postError) {
    message("Post failed: " + postError.message);
    return;
  }

  for (const file of files) {
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    const path = user.id + "/" + crypto.randomUUID() + "_" + safeName;

    const { error: uploadError } = await db.storage
      .from("post-media")
      .upload(path, file);

    if (uploadError) {
      message("Post saved, but a file upload failed: " + uploadError.message);
      await loadPosts();
      return;
    }

    const mediaType = file.type.startsWith("video/") ? "video" : "image";

    const { error: mediaError } = await db
      .from("post_media")
      .insert({
        post_id: post.id,
        user_id: user.id,
        storage_path: path,
        media_type: mediaType
      });

    if (mediaError) {
      message("Post saved, but its media record failed: " + mediaError.message);
      await loadPosts();
      return;
    }
  }

  $("content").value = "";
  $("media").value = "";
  message("Your post was published!");
  await loadPosts();
};

db.auth.onAuthStateChange(() => {
  updateAccount();
});

updateAccount();
loadPosts();
</script>
</body>
</html>
